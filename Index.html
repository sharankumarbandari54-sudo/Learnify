<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Sharankumar!</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 5.5rem;
      margin-bottom: 20px;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px #ff6b6b;
      animation: glow 2s ease-in-out infinite alternate;
      z-index: 10;
    }

    @keyframes glow {
      from { text-shadow: 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6; }
      to   { text-shadow: 0 0 30px #fff, 0 0 50px #ff4da6, 0 0 70px #ff4da6; }
    }

    .name {
      font-size: 4.2rem;
      margin: 20px 0;
      color: #ffe066;
      text-shadow: 3px 3px 10px rgba(0,0,0,0.5);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-30px); }
      60% { transform: translateY(-15px); }
    }

    .msg {
      font-size: 1.8rem;
      max-width: 800px;
      line-height: 1.6;
      margin: 30px auto;
      opacity: 0.95;
    }

    .balloons {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      bottom: -150px;
      width: 80px;
      height: 110px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: rise linear infinite;
      opacity: 0.85;
    }

    .balloon::before {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      width: 2px;
      height: 150px;
      background: rgba(0,0,0,0.3);
      transform: translateX(-50%);
    }

    @keyframes rise {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-120vh) rotate(360deg); }
    }

    .cake {
      margin: 40px 0;
      font-size: 8rem;
      animation: shake 4s infinite;
      z-index: 5;
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      10% { transform: rotate(-3deg); }
      20% { transform: rotate(3deg); }
      30% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }

    .btn {
      margin-top: 30px;
      padding: 15px 40px;
      font-size: 1.5rem;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: all 0.3s;
      z-index: 10;
    }

    .btn:hover {
      transform: translateY(-5px);
      background: #ff6b81;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    @media (max-width: 768px) {
      h1 { font-size: 4rem; }
      .name { font-size: 3.2rem; }
      .cake { font-size: 6rem; }
      .msg { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <div class="balloons" id="balloons"></div>

  <div class="container">
    <h1>Happy Birthday!</h1>
    
    <div class="cake">🎂</div>
    
    <div class="name">Sharankumar!</div>
    
    <p class="msg">
      May your day be filled with laughter, love, delicious cake, and all the things that make you smile! 🌟<br>
      Wishing you an amazing year ahead full of adventures, success, happiness and good health!
    </p>

    <button class="btn" onclick="createMoreBalloons()">More Balloons! 🎈</button>
  </div>

  <script>
    // Balloons animation
    function createBalloon() {
      const balloon = document.createElement("div");
      balloon.classList.add("balloon");
      
      const colors = ["#ff6b6b", "#4ecdc4", "#45b7d1", "#96c93d", "#feca57", "#ff9ff3", "#c8d6e5"];
      balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
      balloon.style.left = Math.random() * 100 + "vw";
      balloon.style.width = (60 + Math.random() * 50) + "px";
      balloon.style.height = (80 + Math.random() * 60) + "px";
      balloon.style.animationDuration = (8 + Math.random() * 10) + "s";
      balloon.style.animationDelay = Math.random() * 5 + "s";
      
      document.getElementById("balloons").appendChild(balloon);
      
      setTimeout(() => {
        balloon.remove();
      }, 18000);
    }

    // Create initial balloons
    for(let i = 0; i < 25; i++) {
      setTimeout(createBalloon, i * 300);
    }

    // More balloons on button click
    window.createMoreBalloons = function() {
      for(let i = 0; i < 15; i++) {
        setTimeout(createBalloon, i * 150);
      }
    }
  </script>

</body>
</html>
